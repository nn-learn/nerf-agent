[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "psyavatar-care-avatar-radnerf"
version = "0.1.0"
description = "Cancellable Python 3.10 adapter for the existing RAD-NeRF assets."
requires-python = ">=3.10,<3.11"
dependencies = [
  "grpcio>=1.70,<2",
  "protobuf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["avatar*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "gpu: requires the explicit Python 3.10 CUDA RAD-NeRF environment",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["avatar"]
